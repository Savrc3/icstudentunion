name: Sync Upstream

on:
  schedule:
    # 每天 UTC 16:00 (北京时间 00:00) 检查一次
    - cron: '0 16 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install Pillow cos-python-sdk-v5 requests
      
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Check for upstream changes
        id: check
        run: |
          # 获取上游最新提交
          UPSTREAM_SHA=$(curl -s https://api.github.com/repos/ASUKAwph/icstudentunion/commits?per_page=1 | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['sha'][:7])")
          echo "upstream_sha=$UPSTREAM_SHA" >> $GITHUB_OUTPUT
          
          # 获取本地最后同步的提交
          LOCAL_SHA=$(git log --oneline -20 | grep -oP '[a-f0-9]{7}' | head -1)
          echo "local_sha=$LOCAL_SHA" >> $GITHUB_OUTPUT
          
          if [ "$UPSTREAM_SHA" = "$LOCAL_SHA" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ Already up to date ($UPSTREAM_SHA)"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "⬆️ New update available: $UPSTREAM_SHA (local: $LOCAL_SHA)"
          fi
      
      - name: Sync upstream
        if: steps.check.outputs.changed == 'true'
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          python sync.py --force
      
      - name: Verify deployment
        if: steps.check.outputs.changed == 'true'
        run: |
          sleep 30  # 等待 Cloudflare Pages 部署
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://icstudentunion.pages.savrc3.icu/)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Deployment verified"
          else
            echo "⚠️ Deployment status: $STATUS (may still be deploying)"
          fi
